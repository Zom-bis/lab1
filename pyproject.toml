[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit"
version = "1.0.0"
description = "Калькулятор и конвертер величин (ЛР1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["toolkit", "calculator", "converter", "errors", "constants", "history"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# E, W, F — основные ошибки; I — порядок импортов; ANN — аннотации типов;
# S102, S307 — запрет exec и eval; T20 — запрет print
select = ["E", "W", "F", "I", "ANN", "S102", "S307", "T20"]

[tool.ruff.lint.per-file-ignores]
"src/toolkit.py" = ["T201"]  # в CLI печатать можно
"tests/*" = ["S101", "S603"]          # assert и subprocess в тестах
